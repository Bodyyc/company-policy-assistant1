<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Helvig Policy Lab</title>
<style>
body{margin:0;background:#f3f0e8;color:#1c1915;font:18px/1.5 Georgia,sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 16px 64px}
button,textarea{font:inherit}
button{background:#1e3a34;color:#f4f1ea;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
textarea{width:100%;box-sizing:border-box;min-height:72px;border:1px solid #e0d9cc;border-radius:8px;padding:8px;background:#faf8f3}
.card{background:#faf8f3;border:1px solid #e0d9cc;border-radius:16px;padding:16px;margin:12px 0}
</style>
</head>
<body>
<main>
<p>Company policy assistant</p>
<h1>Three ways to answer the same policy question</h1>
<p>Rules-based search, a language model with no policy index, and a language model limited to a TF-IDF vector index. Each result shows the answer, the policy, the time, the tokens, and the unsupported-claim score.</p>
<textarea id="q">How many vacation days do employees get, and can unused days roll over?</textarea>
<p><button id="go">Compare approaches</button></p>
<div id="out"></div>
</main>
<script>
const recorded={
"how many vacation days do employees get, and can unused days roll over?":[["Rules-based search","Vacation Policy (HR-VACATION): Employees receive 15 vacation days per year. Unused days may roll over.","HR-VACATION","1 ms","0","0"],["LLM without a vector index","Full-time employees receive 15 paid vacation days per year. Up to 5 unused days may roll over; any excess is forfeited.","none","9612 ms","1199","25"],["LLM with a vector index","Employees receive 15 vacation days per year. Unused days may roll over.","HR-VACATION","2667 ms","883","0"]],
"how many days a week can i work remotely?":[["Rules-based search","Remote Work Policy (REM-REMOTE-WORK): Employees may work remotely up to three days per week with manager approval.","REM-REMOTE-WORK","1 ms","0","0"],["LLM without a vector index","Abstained. The model had no policy text and did not state a number.","none","4401 ms","1004","0"],["LLM with a vector index","Employees may work remotely up to three days per week with manager approval.","REM-REMOTE-WORK","2472 ms","916","0"]],
"do expenses over $500 need approval, and from whom?":[["Rules-based search","Expense Approval Policy (FIN-EXPENSE-APPROVAL): All expenses over $500 require prior approval from Finance.","FIN-EXPENSE-APPROVAL","1 ms","0","0"],["LLM without a vector index","Invented a manager sign-off. The policy says Finance.","none","4828 ms","919","45"],["LLM with a vector index","All expenses over $500 require prior approval from Finance.","FIN-EXPENSE-APPROVAL","3462 ms","943","0"]],
"what percentage of salary does the company contribute to my pension?":[["Rules-based search","No rule matched. The database has no pension policy.","none","1 ms","0","0"],["LLM without a vector index","Invented a 5 percent contribution under a Retirement Benefits Policy that is not in the database.","none","6958 ms","1154","57"],["LLM with a vector index","The policy database does not contain this.","none","2519 ms","827","0"]]
};
document.getElementById("go").onclick=()=>{const q=document.getElementById("q").value.trim().toLowerCase();const rows=recorded[q];const out=document.getElementById("out");if(!rows){out.innerHTML="<p>Use one of the four recorded questions: vacation days, remote days, expenses over $500, or pension percentage.</p>";return;}out.innerHTML=rows.map(r=>`<article class=\"card\"><h2>${r[0]}</h2><p>Policy: ${r[2]}</p><p>${r[1]}</p><p>Time ${r[3]} · Tokens ${r[4]} · Unsupported ${r[5]}</p></article>`).join("");};
</script>
</body>
</html>
